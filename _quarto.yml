project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "!notes/"


website:
  title: "Building Bioinformatics"
  description: "Practical notes on software engineering, reproducibility, workflows, and research infrastructure for bioinformatics."
  site-url: "https://angemerkel.github.io/building-bioinformatics"
  repo-url: "https://github.com/angemerkel/building-bioinformatics"

  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: "https://github.com/angemerkel"
      - icon: linkedin
        href: "https://www.linkedin.com/"

  page-footer:
    left: "© Angelika Merkel"
    right: "Build with Quarto"

format:
  html:
    theme:
      - cosmo
      - assets/css/styles.css
    toc: true
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto